apiVersion: apps/v1
kind: Deployment
metadata:
  name: bidding-engine
  namespace: food-delivery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bidding-engine
  template:
    metadata:
      labels:
        app: bidding-engine
    spec:
      containers:
        - name: bidding-engine
          image: food-delivery/bidding-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8102
          envFrom:
            - configMapRef:
                name: advertisement-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8102
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8102
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
